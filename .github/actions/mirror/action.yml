# SPDX-License-Identifier: MIT
name: Mirror the apk repository to YuruMirror
description: >
  Copy the site's alpine/ directory to mirror.funami.tech: the github-pages artifact this run
  deployed, or, when this run deployed nothing, the live site (so a mirror that missed an update
  catches up), over the tailnet, as linux-hiby-rs6 and linux-zflip3 do it: Tailscale with the
  TS_OAUTH_CLIENT_ID/TS_AUDIENCE federated identity (tag:ci), then rsync over SSH with SSH_HOST,
  SSH_USER, SSH_KEY into REMOTE_DIR/alpine. The target becomes an exact copy (rsync --delete), minus
  HTML pages, so YuruMirror's own directory listing shows there. Without the secrets it does nothing
  but say so.

inputs:
  deployed: { description: whether this run deployed the site, required: true }
  site-url: { description: the live Pages site, required: true }
  ts-oauth-client-id: { description: secrets.TS_OAUTH_CLIENT_ID, default: "" }
  ts-audience: { description: secrets.TS_AUDIENCE, default: "" }
  ssh-host: { description: secrets.SSH_HOST, default: "" }
  ssh-user: { description: secrets.SSH_USER, default: "" }
  ssh-key: { description: secrets.SSH_KEY, default: "" }
  remote-dir: { description: "secrets.REMOTE_DIR, e.g. /opt/mirrorwww/r26-mainline", default: "" }

runs:
  using: composite
  steps:
    - name: Mirror secrets
      id: secrets
      shell: bash
      env:
        TS_ID: ${{ inputs.ts-oauth-client-id }}
        TS_AUD: ${{ inputs.ts-audience }}
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_KEY: ${{ inputs.ssh-key }}
        REMOTE_DIR: ${{ inputs.remote-dir }}
      run: |
        missing=
        for v in TS_ID:TS_OAUTH_CLIENT_ID TS_AUD:TS_AUDIENCE SSH_HOST:SSH_HOST SSH_USER:SSH_USER \
          SSH_KEY:SSH_KEY REMOTE_DIR:REMOTE_DIR; do
          name=${v%%:*}
          [ -n "${!name}" ] || missing="$missing ${v#*:}"
        done
        if [ -n "$missing" ]; then
          echo "::notice::Not mirroring to mirror.funami.tech: secret(s)$missing not set"
          echo "ok=false" >> "$GITHUB_OUTPUT"
        else
          echo "ok=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Download the deployed site
      if: steps.secrets.outputs.ok == 'true' && inputs.deployed == 'true'
      uses: actions/download-artifact@v4
      with:
        name: github-pages
        path: ${{ runner.temp }}/pages

    - name: Get the site
      if: steps.secrets.outputs.ok == 'true'
      shell: bash
      env:
        DEPLOYED: ${{ inputs.deployed }}
        SITE_URL: ${{ inputs.site-url }}
      run: |
        site=$RUNNER_TEMP/site
        mkdir -p "$site"
        if [ "$DEPLOYED" = true ]; then
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C "$site"
        else
          python3 -I "$GITHUB_ACTION_PATH/../../alpine/repo.py" fetch "$SITE_URL" "$site"
        fi
        find "$site" -type f | wc -l

    - name: Tailscale
      if: steps.secrets.outputs.ok == 'true'
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        audience: ${{ inputs.ts-audience }}
        tags: tag:ci
        version: latest

    - name: Upload to mirror.funami.tech
      if: steps.secrets.outputs.ok == 'true'
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_KEY: ${{ inputs.ssh-key }}
        REMOTE_DIR: ${{ inputs.remote-dir }}
      run: |
        src=$RUNNER_TEMP/site/alpine/
        [ -d "$src" ] || { echo "::notice::Nothing published yet, not mirroring"; exit 0; }
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
        remote=$SSH_USER@$SSH_HOST
        ssh "$remote" "mkdir -p '$REMOTE_DIR/alpine/'"
        rsync -rlt --checksum --delete --delete-excluded --exclude='*.html' --stats \
          "$src" "$remote:$REMOTE_DIR/alpine/" | tail -n 16
        echo "mirrored to https://mirror.funami.tech/${REMOTE_DIR#/opt/mirrorwww/}/alpine/" >> "$GITHUB_STEP_SUMMARY"
